<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leaderboard — TaskCash Kenya</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#39ff14">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/styles.css">
</head>
<body>
<nav class="nav">
  <div class="container nav-inner">
    <a class="logo" href="/"><span class="k">Task</span>Cash</a>
    <div class="nav-links" id="nav-links">
      <a href="/dashboard.html">Dashboard</a>
      <a href="/tasks.html">Tasks</a>
      <a href="/wallet.html">Wallet</a>
      <a href="/referrals.html">Referrals</a>
      <a href="/leaderboard.html">Leaderboard</a>
      <a href="/extras.html">Extras</a>
      <a href="/settings.html">Settings</a>
      <a href="#" id="logout">Logout</a>
    </div>
    <div style="display:flex;gap:8px;align-items:center">
      <button class="icon-btn" data-theme-toggle aria-label="Toggle theme">☀️</button>
      <button class="icon-btn nav-burger" aria-label="Menu">☰</button>
    </div>
  </div>
</nav>

<section style="padding:34px 0">
  <div class="container" style="max-width:760px">
    <h1 style="margin:0 0 6px;font-size:1.6rem">🏆 Top earners</h1>
    <p class="muted small" style="margin:0 0 22px">Ranked by verified task earnings. Usernames are masked for privacy.</p>
    <div class="glass card">
      <div class="table-wrap" style="border:none">
        <table class="tbl">
          <thead><tr><th>Rank</th><th>Earned</th><th>Tasks</th></tr></thead>
          <tbody id="lb-body"><tr><td colspan="3" class="muted">Loading…</td></tr></tbody>
        </table>
      </div>
    </div>
  </div>
</section>

<script src="/assets/js/api.js"></script>
<script src="/assets/js/ui.js"></script>
<script>
UI.setTheme(localStorage.getItem('tc_theme') || 'dark');
UI.requireLogin();
UI.el('logout').addEventListener('click', async (e) => {
  e.preventDefault();
  await API.post('/api/auth/logout').catch(() => {});
  API.clearSession(); location.href = '/login.html';
});

(async () => {
  try {
    const { leaderboard } = await API.get('/api/leaderboard');
    const medals = { 1: '🥇', 2: '🥈', 3: '🥉' };
    UI.el('lb-body').innerHTML = leaderboard.map((l) => `
      <tr>
        <td><strong>${medals[l.rank] || '#' + l.rank}</strong> ${UI.esc(l.username)}</td>
        <td style="font-weight:700;color:var(--neon)">${UI.kes(l.total_earned)}</td>
        <td>${l.tasks}</td>
      </tr>`).join('') || '<tr><td colspan="3" class="muted">No earners yet.</td></tr>';
  } catch (e) { UI.toast(e.message, 'error'); }
})();
</script>
</body>
</html>

<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Verify email — TaskCash Kenya</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/styles.css">
</head>
<body>
<nav class="nav">
  <div class="container nav-inner">
    <a class="logo" href="/"><span class="k">Task</span>Cash</a>
  </div>
</nav>
<section style="padding:80px 0">
  <div class="container" style="max-width:480px;text-align:center">
    <div class="glass card fade-up">
      <div id="state" class="muted">Verifying your email…</div>
      <div style="margin-top:18px">
        <a class="btn btn-primary" href="/dashboard.html">Go to dashboard</a>
      </div>
    </div>
  </div>
</section>
<script src="/assets/js/api.js"></script>
<script src="/assets/js/ui.js"></script>
<script>
UI.setTheme(localStorage.getItem('tc_theme') || 'dark');
(async () => {
  const token = new URLSearchParams(location.search).get('token');
  const el = UI.el('state');
  if (!token) { el.textContent = 'No verification token found in the link.'; return; }
  try {
    const res = await API.get(`/api/auth/verify-email?token=${encodeURIComponent(token)}`);
    el.innerHTML = `<span class="badge">✅ Verified</span><p style="margin-top:10px">${UI.esc(res.message)}</p>`;
  } catch (err) {
    el.innerHTML = `<span class="badge badge-danger">Verification failed</span><p style="margin-top:10px">${UI.esc(err.message)}</p>`;
  }
})();
</script>
</body>
</html>

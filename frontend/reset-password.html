<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Set new password — TaskCash Kenya</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/styles.css">
</head>
<body>
<nav class="nav">
  <div class="container nav-inner">
    <a class="logo" href="/"><span class="k">Task</span>Cash</a>
  </div>
</nav>
<section style="padding:56px 0">
  <div class="container" style="max-width:440px">
    <div class="glass card fade-up">
      <h1 style="margin:0 0 6px;font-size:1.5rem">Set a new password</h1>
      <p class="muted small">Choose a strong password — 8+ characters with letters and numbers.</p>
      <form id="form" style="margin-top:16px">
        <div class="field">
          <label for="password">New password</label>
          <input class="input" id="password" type="password" required minlength="8" placeholder="8+ characters" autocomplete="new-password">
        </div>
        <div class="field">
          <label for="password2">Confirm password</label>
          <input class="input" id="password2" type="password" required minlength="8" autocomplete="new-password">
        </div>
        <button class="btn btn-primary btn-block" id="submit" type="submit">Update password</button>
      </form>
    </div>
  </div>
</section>
<script src="/assets/js/api.js"></script>
<script src="/assets/js/ui.js"></script>
<script>
UI.setTheme(localStorage.getItem('tc_theme') || 'dark');
const token = new URLSearchParams(location.search).get('token');
if (!token) { document.body.innerHTML = '<div style="padding:60px;text-align:center">Missing token. <a href="/forgot-password.html">Request a new link</a>.</div>'; }

UI.el('form').addEventListener('submit', async (e) => {
  e.preventDefault();
  if (UI.el('password').value !== UI.el('password2').value) return UI.toast('Passwords do not match', 'error');
  const btn = UI.el('submit');
  btn.disabled = true;
  try {
    await API.post('/api/auth/reset-password', { token, password: UI.el('password').value });
    UI.toast('Password updated — log in with your new password');
    setTimeout(() => location.href = '/login.html', 1200);
  } catch (err) { UI.toast(err.message, 'error', 5000); btn.disabled = false; }
});
</script>
</body>
</html>

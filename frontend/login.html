<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login — TaskCash Kenya</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#39ff14">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/styles.css">
</head>
<body>
<nav class="nav">
  <div class="container nav-inner">
    <a class="logo" href="/"><span class="k">Task</span>Cash</a>
    <div style="display:flex;gap:8px;align-items:center">
      <button class="icon-btn" data-theme-toggle aria-label="Toggle theme">☀️</button>
      <a class="btn btn-ghost btn-sm" href="/register.html">Create account</a>
    </div>
  </div>
</nav>

<section style="padding:56px 0">
  <div class="container" style="max-width:440px">
    <div class="glass card fade-up">
      <h1 style="margin:0 0 4px;font-size:1.7rem">Welcome back</h1>
      <p class="muted small" style="margin-top:0">Log in to continue earning</p>

      <form id="form" style="margin-top:18px">
        <div class="field">
          <label for="identifier">Email or username</label>
          <input class="input" id="identifier" required placeholder="you@example.com" autocomplete="username">
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input class="input" id="password" type="password" required placeholder="••••••••" autocomplete="current-password">
        </div>
        <button class="btn btn-primary btn-block" id="submit" type="submit">Log in</button>
        <p class="center small" style="margin-top:14px">
          <a href="/forgot-password.html">Forgot password?</a>
        </p>
        <p class="center small muted" style="margin-top:6px">
          New here? <a href="/register.html">Create an account</a>
        </p>
      </form>
    </div>

    <div class="glass card" style="margin-top:16px" id="demo-box">
      <strong class="small">🧪 Demo accounts</strong>
      <p class="small muted" style="margin:6px 0 10px">After running <span class="mono">npm run seed</span>:</p>
      <div class="small mono" style="line-height:1.9">
        User: wanjiku / Demo@1234<br>
        Admin: admin@taskcash.co.ke / Admin@1234
      </div>
    </div>
  </div>
</section>

<script src="/assets/js/api.js"></script>
<script src="/assets/js/ui.js"></script>
<script>
UI.setTheme(localStorage.getItem('tc_theme') || 'dark');
if (API.user()) location.href = '/dashboard.html';

UI.el('form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = UI.el('submit');
  btn.disabled = true; btn.textContent = 'Logging in…';
  try {
    const res = await API.post('/api/auth/login', {
      identifier: UI.el('identifier').value.trim(),
      password: UI.el('password').value,
    });
    API.setSession(res);
    UI.toast(`Karibu, ${res.user.username}!`);
    setTimeout(() => location.href = res.user.role === 'admin' ? '/admin.html' : '/dashboard.html', 700);
  } catch (err) {
    UI.toast(err.message, 'error', 5000);
    btn.disabled = false; btn.textContent = 'Log in';
  }
});
</script>
</body>
</html>

<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forgot password — TaskCash</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/styles.css">
</head>
<body>
<nav class="nav">
  <div class="container nav-inner">
    <a class="logo" href="/"><span class="k">Task</span>Cash</a>
  </div>
</nav>
<section style="padding:56px 0">
  <div class="container" style="max-width:440px">
    <div class="glass card fade-up">
      <h1 style="margin:0 0 6px;font-size:1.5rem">Reset your password</h1>
      <p class="muted small">Enter your account email. If it exists, we'll send a reset link.</p>
      <form id="form" style="margin-top:16px">
        <div class="field">
          <label for="email">Email</label>
          <input class="input" id="email" type="email" required placeholder="you@example.com">
        </div>
        <button class="btn btn-primary btn-block" id="submit" type="submit">Send reset link</button>
        <p class="center small" style="margin-top:14px"><a href="/login.html">Back to login</a></p>
      </form>
      <div id="result" class="hidden" style="margin-top:14px"></div>
    </div>
  </div>
</section>
<script src="/assets/js/api.js"></script>
<script src="/assets/js/ui.js"></script>
<script>
UI.setTheme(localStorage.getItem('tc_theme') || 'dark');
UI.el('form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = UI.el('submit');
  btn.disabled = true; btn.textContent = 'Sending…';
  try {
    const res = await API.post('/api/auth/forgot-password', { email: UI.el('email').value.trim() });
    const box = UI.el('result');
    box.classList.remove('hidden');
    box.innerHTML = `<div class="badge">Check your inbox</div><p class="small muted" style="margin-top:8px">${UI.esc(res.message)}</p>` +
      (res.reset_url ? `<p class="small">Dev link: <a href="${UI.esc(res.reset_url)}">open reset page</a></p>` : '');
  } catch (err) { UI.toast(err.message, 'error'); }
  btn.disabled = false; btn.textContent = 'Send reset link';
});
</script>
</body>
</html>

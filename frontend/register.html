<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Create account — TaskCash</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#39ff14">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/styles.css">
</head>
<body>
<nav class="nav">
  <div class="container nav-inner">
    <a class="logo" href="/"><span class="k">Task</span>Cash</a>
    <div style="display:flex;gap:8px;align-items:center">
      <button class="icon-btn" data-theme-toggle aria-label="Toggle theme">☀️</button>
      <a class="btn btn-ghost btn-sm" href="/login.html">Login</a>
    </div>
  </div>
</nav>

<section style="padding:40px 0 64px">
  <div class="container" style="max-width:520px">
    <div class="glass card fade-up">
      <h1 style="margin:0 0 4px;font-size:1.7rem">Create your account</h1>
      <p class="muted small" style="margin-top:0">Free · welcome bonus · takes 60 seconds</p>

      <form id="form" style="margin-top:18px">
        <div class="field">
          <label for="fullname">Full name</label>
          <input class="input" id="fullname" required minlength="3" placeholder="Your full name" autocomplete="name">
        </div>
        <div class="field">
          <label for="username">Username</label>
          <input class="input" id="username" required pattern="[A-Za-z0-9_]{3,20}" placeholder="e.g. jane_doe" autocomplete="username">
          <div class="hint">3–20 letters, numbers or underscore</div>
        </div>
        <div class="field">
          <label for="country">Country <span class="muted">(sets your account currency)</span></label>
          <select class="input" id="country" required>
            <option value="">Select your country…</option>
          </select>
          <div class="hint" id="country-hint">Available worldwide</div>
        </div>
        <div class="field">
          <label for="phone">Phone number</label>
          <input class="input" id="phone" required placeholder="+254 7XX XXX XXX" inputmode="tel" autocomplete="tel">
          <div class="hint" id="phone-hint">Used for account verification & payouts</div>
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input class="input" id="email" type="email" required placeholder="you@example.com" autocomplete="email">
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input class="input" id="password" type="password" required minlength="8" placeholder="8+ characters, letters & numbers" autocomplete="new-password">
        </div>
        <div class="field">
          <label for="ref_code">Referral code <span class="muted">(optional)</span></label>
          <input class="input" id="ref_code" placeholder="e.g. GR1A2B3C4D" style="text-transform:uppercase">
        </div>

        <label class="small muted" style="display:flex;gap:8px;align-items:flex-start;margin:14px 0">
          <input type="checkbox" id="terms" required style="margin-top:3px">
          <span>I understand TaskCash is a <strong>rewards platform — not an investment</strong>. Earnings depend on tasks I complete and are not guaranteed.</span>
        </label>

        <button class="btn btn-primary btn-block" id="submit" type="submit">Create account</button>
        <p class="center small muted" style="margin-top:14px">
          Already have an account? <a href="/login.html">Log in</a>
        </p>
      </form>
    </div>
  </div>
</section>

<script src="/assets/js/api.js"></script>
<script src="/assets/js/countries.js"></script>
<script src="/assets/js/ui.js"></script>
<script>
UI.setTheme(localStorage.getItem('tc_theme') || 'dark');

// ── Country picker: every country, no default selection ──
const countrySel = UI.el('country');
COUNTRIES.forEach((c) => {
  const opt = document.createElement('option');
  opt.value = c.code;
  opt.textContent = `${c.name} (${c.code}) — ${c.currency_code}`;
  countrySel.appendChild(opt);
});

// Kenya-specific helper text only for Kenyan users.
function onCountryChange() {
  const c = COUNTRY_BY_CODE[countrySel.value];
  UI.el('country-hint').textContent = c ? `Currency: ${c.currency_code}` : 'Available worldwide';
  if (countrySel.value === 'KE') {
    UI.el('phone').placeholder = '07XX XXX XXX';
    UI.el('phone-hint').textContent = 'M-Pesa number — used for deposits & payouts';
  } else {
    UI.el('phone').placeholder = '+<country code> XXX XXX XXX';
    UI.el('phone-hint').textContent = 'Used for account verification & payouts';
  }
}
countrySel.addEventListener('change', onCountryChange);

// Capture ?ref=CODE from referral links
const refParam = new URLSearchParams(location.search).get('ref');
if (refParam) UI.el('ref_code').value = refParam.toUpperCase();

UI.el('form').addEventListener('submit', async (e) => {
  e.preventDefault();
  if (!countrySel.value) { UI.toast('Select your country to continue', 'error'); return; }
  const btn = UI.el('submit');
  btn.disabled = true; btn.textContent = 'Creating account…';
  try {
    const res = await API.post('/api/auth/register', {
      fullname: UI.el('fullname').value.trim(),
      username: UI.el('username').value.trim(),
      email: UI.el('email').value.trim(),
      phone: UI.el('phone').value.trim(),
      country_code: countrySel.value,
      password: UI.el('password').value,
      ref_code: UI.el('ref_code').value.trim().toUpperCase() || undefined,
    });
    API.setSession(res);
    localStorage.setItem('tc_currency', res.user.currency_code || '');
    UI.toast('Welcome to TaskCash! 🎉 Bonus added');
    setTimeout(() => location.href = '/dashboard.html', 900);
  } catch (err) {
    UI.toast(err.message, 'error', 5000);
    btn.disabled = false; btn.textContent = 'Create account';
  }
});
</script>
</body>
</html>

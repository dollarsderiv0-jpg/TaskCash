name: Money invariants

# The suite needs a real Postgres, not a Supabase project: scripts/lib/auth-shim.mjs
# installs the minimal `auth` schema, roles and auth.uid() that the migrations
# depend on, so this runs on a stock Postgres service container with no secrets.

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  money-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: taskcash_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/taskcash_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Creates a scratch database, applies the real migrations to it, and runs
      # the full invariant suite — including the two-connection concurrency race.
      # The scratch database is dropped afterwards.
      - name: Money invariants
        run: npm run test:money

  # Same suite with no service container and no DATABASE_URL, so the money rules
  # stay verified even if the Postgres service is unavailable. This mode skips
  # the two-connection race: PGlite serialises connections and cannot stage real
  # lock contention, so it is a faster signal, never a replacement.
  money-tests-no-setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Money invariants (in-process Postgres)
        run: npm run test:money:local
